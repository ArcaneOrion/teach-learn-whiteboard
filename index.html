<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + viewport-fit=cover：手机上禁止双指缩放页面，并让内容延伸到刘海/圆角区域 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fbfaf7" />
    <title>共写白板</title>
  </head>
  <body>
    <!-- 状态条：一行，永远在 -->
    <header class="statusbar">
      <span class="statusbar__title">共写白板</span>
      <span class="statusbar__meta" id="status">M1 · 事件日志</span>
    </header>

    <!--
      板面分三层（技术文档 §5.1）：
        ① 背景层  —— 板面底色
        ② 内容层  —— AI 写的 HTML（div#content）
        ③ 墨迹层  —— 用户的笔迹（canvas#ink，在最上面）

      墨迹在最上层，所以能在 AI 写的东西上直接圈画；
      而 AI 更新内容层时不会碰墨迹层，用户的笔迹不会消失。
    -->
    <main class="stage" id="stage">
      <div class="scroller" id="scroller">
        <div class="board" id="board">
          <!-- ② 内容层 -->
          <div class="layer layer--content" id="content"></div>
          <!-- ③ 墨迹层 -->
          <canvas id="ink"></canvas>
        </div>
      </div>
    </main>

    <!-- 工具栏 -->
    <footer class="toolbar">
      <div class="toolbar__group" role="group" aria-label="工具">
        <button class="btn is-active" data-tool="pen" type="button">✏️ 笔</button>
        <button class="btn" data-tool="eraser" type="button">🧽 橡皮</button>
        <!-- 拖动模式：让指针事件穿透到下面的滚动容器，就能用手指滚板面了 -->
        <button class="btn" data-tool="pan" type="button">✋ 拖动</button>
      </div>

      <div class="toolbar__group" role="group" aria-label="颜色">
        <button class="swatch is-active" data-color="#1f2328" style="--c: #1f2328" type="button" aria-label="黑色"></button>
        <button class="swatch" data-color="#e5484d" style="--c: #e5484d" type="button" aria-label="红色"></button>
        <button class="swatch" data-color="#2563eb" style="--c: #2563eb" type="button" aria-label="蓝色"></button>
        <button class="swatch" data-color="#047857" style="--c: #047857" type="button" aria-label="绿色"></button>
      </div>

      <div class="toolbar__group" role="group" aria-label="粗细">
        <button class="btn" data-size="2" type="button">细</button>
        <button class="btn is-active" data-size="4" type="button">中</button>
        <button class="btn" data-size="8" type="button">粗</button>
      </div>

      <div class="toolbar__group" role="group" aria-label="操作">
        <button class="btn" id="undo" type="button">↩️ 撤销</button>
        <button class="btn" id="clear" type="button">🗑 清空</button>
      </div>

      <!-- ⚠️ 临时：M1 用来验证「AI 写板面」这条链路，M2 接上真模型后删掉 -->
      <div class="toolbar__group toolbar__group--demo" role="group" aria-label="假 AI（临时）">
        <button class="btn btn--demo" id="demo-append" type="button">🤖 追加</button>
        <button class="btn btn--demo" id="demo-rewrite" type="button">✏️ 改写</button>
        <button class="btn btn--demo" id="demo-remove" type="button">🧹 擦掉</button>
      </div>
    </footer>

    <!-- 调试读数：验证输入质量与事件日志。M4 之后会去掉 -->
    <div class="hud" id="hud" aria-live="off"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
